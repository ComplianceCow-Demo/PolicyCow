apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audit-pod
  name: test2
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: audit-pod
  template:
    metadata:
      labels:
        app: audit-pod
    spec:
      containers:
      - env:
        - name: random
          value: Hello from the environment
        image: hashicorp/http-echo:0.2.3
        name: test-container
        securityContext:
          allowPrivilegeEscalation: true
          privileged: false
      - env:
        - name: azure_batch_key
          value: Hello from the environment
        image: hashicorp/http-echo:0.2.3
        name: test-container2
        securityContext:
          privileged: false
