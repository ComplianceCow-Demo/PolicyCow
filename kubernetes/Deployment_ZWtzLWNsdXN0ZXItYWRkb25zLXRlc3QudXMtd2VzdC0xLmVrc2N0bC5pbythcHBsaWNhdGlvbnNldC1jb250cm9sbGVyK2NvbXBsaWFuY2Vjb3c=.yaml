apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audit-pod
  name: applicationset-controller
spec:
  replicas: 3
  selector:
    matchLabels:
      app: audit-pod
  template:
    metadata:
      labels:
        app: audit-pod
    spec:
      containers:
      - env:
        - name: ROOT_PASSWORD
          value: rootpasswd
        image: hashicorp/http-echo:0.2.3
        name: applicationset-controller
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
      - env:
        - name: azure_batch_key
          value: Hello from the environment
        image: hashicorp/http-echo:0.2.3
        name: applicationset-controller-repo
        securityContext:
          allowPrivilegeEscalation: true
      hostIPC: false
      hostPID: false
