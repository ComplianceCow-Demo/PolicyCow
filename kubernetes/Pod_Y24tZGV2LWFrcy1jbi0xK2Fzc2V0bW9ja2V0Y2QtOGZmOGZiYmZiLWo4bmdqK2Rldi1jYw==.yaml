spec:
  containers:
  - command:
    - sh
    - -c
    - |
      /opt/bitnami/scripts/etcd/run.sh &
      ETCD_PID=$!

      RETRIES=0
      until \
        ETCDCTL_API=3 etcdctl \
          --endpoints=http://127.0.0.1:2379 \
          endpoint health >/dev/null 2>&1 || \
        ETCDCTL_API=3 etcdctl \
          --endpoints=http://127.0.0.1:2379 \
          --user=root:${ETCD_ROOT_PASSWORD} \
          endpoint health >/dev/null 2>&1
      do
        echo "Waiting for etcd... attempt $RETRIES"
        RETRIES=$((RETRIES+1))

        if [ $RETRIES -eq 30 ]; then
          echo "etcd did not become ready in time"
          exit 1
        fi

        sleep 2
      done

      echo "etcd is ready, ensuring auth..."

      etcdctl --endpoints=http://127.0.0.1:2379 \
        user add root:${ETCD_ROOT_PASSWORD} 2>/dev/null || true

      etcdctl --endpoints=http://127.0.0.1:2379 \
        user grant-role root root 2>/dev/null || true

      etcdctl --endpoints=http://127.0.0.1:2379 \
        --user=root:${ETCD_ROOT_PASSWORD} auth enable 2>/dev/null || true

      etcdctl --endpoints=http://127.0.0.1:2379 \
        --user=root:${ETCD_ROOT_PASSWORD} \
        role add cowetcd-role 2>/dev/null || true

      etcdctl --endpoints=http://127.0.0.1:2379 \
        --user=root:${ETCD_ROOT_PASSWORD} \
        role grant-permission cowetcd-role readwrite "" --prefix=true 2>/dev/null || true

      etcdctl --endpoints=http://127.0.0.1:2379 \
        --user=root:${ETCD_ROOT_PASSWORD} \
        user add appuser:${ETCD_APP_PASSWORD} 2>/dev/null || true

      etcdctl --endpoints=http://127.0.0.1:2379 \
        --user=root:${ETCD_ROOT_PASSWORD} \
        user grant-role appuser cowetcd-role 2>/dev/null || true

      echo "Auth setup complete. etcd is secured."

      wait $ETCD_PID
    env:
